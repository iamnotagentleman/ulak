basePath: /
definitions:
  apierror.APIError:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  models.GetMessagesData:
    properties:
      limit:
        type: integer
      messages:
        items:
          $ref: '#/definitions/models.Message'
        type: array
      offset:
        type: integer
      totalCount:
        type: integer
    type: object
  models.GetMessagesResponse:
    properties:
      data:
        $ref: '#/definitions/models.GetMessagesData'
      result:
        $ref: '#/definitions/apierror.APIError'
    type: object
  models.Message:
    properties:
      channel:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      message:
        maxLength: 4096
        type: string
      offset:
        type: integer
      status:
        type: string
      to:
        type: string
      updated_at:
        type: string
    type: object
  models.SetMessageAutoSendData:
    properties:
      isPopulatorEnabled:
        type: boolean
      isProcessorEnabled:
        type: boolean
    type: object
  models.SetMessageAutoSendRequest:
    properties:
      action:
        enum:
        - start
        - stop
        type: string
    type: object
  models.SetMessageAutoSendResponse:
    properties:
      data:
        $ref: '#/definitions/models.SetMessageAutoSendData'
      result:
        $ref: '#/definitions/apierror.APIError'
    type: object
host: localhost:8080
info:
  contact: {}
  description: API key authentication.
  title: Ulak API
  version: "1.0"
paths:
  /messages/auto-send:
    post:
      consumes:
      - application/json
      description: Enable or disable automatic message sending
      parameters:
      - description: Auto-send configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.SetMessageAutoSendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SetMessageAutoSendResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.SetMessageAutoSendResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.SetMessageAutoSendResponse'
      security:
      - ApiKeyAuth: []
      summary: Set message auto-send configuration
      tags:
      - messages
  /messages/sent:
    get:
      consumes:
      - application/json
      description: Retrieve a list of sent messages
      parameters:
      - default: 10
        description: Number of messages to return
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset for pagination
        in: query
        name: offset
        type: integer
      - default: false
        description: Filter by delivery status
        in: query
        name: isDelivered
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.GetMessagesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.GetMessagesResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.GetMessagesResponse'
      security:
      - ApiKeyAuth: []
      summary: Get sent messages
      tags:
      - messages
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: x-ins-auth-key
    type: apiKey
swagger: "2.0"
